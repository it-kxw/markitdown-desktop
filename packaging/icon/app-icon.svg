<?xml version="1.0" encoding="UTF-8"?>
<!--
  MarkItDown Desktop 应用图标（源文件，矢量）。

  设计：圆角方块（rx=58/256 ≈ 23%，接近 Win11 squircle 手感）+ 135 度双色渐变
  + 白色描边符号 M。符号用 path 画，不依赖字体 —— CI 上不会因为缺字体而糊掉。

  改这个文件之后必须重新生成 ICO：python scripts/make_icon.py
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="body-gradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>
  </defs>
  <rect x="10" y="10" width="236" height="236" rx="58" ry="58" fill="url(#body-gradient)"/>
  <path d="M84 182 V90 L128 144 L172 90 V182"
        stroke="#FFFFFF" stroke-width="26" stroke-linecap="round"
        stroke-linejoin="round" fill="none"/>
</svg>
