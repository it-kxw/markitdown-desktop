# MarkItDown Desktop —— Release：打 tag 自动出安装包 + 免安装 zip 并挂到 Release
#
# 设计要点
#   1) 只在 `v*` tag 上触发：发布是显式动作，不跟 push 混在一起；
#   2) 先校验 tag 与 pyproject 版本一致：避免「v0.2.0 的包里是 0.1.0」这种事故；
#   3) 出包后仍要跑冻结包自测与体积闸门：红灯就不发布；
#   4) 用 runner 自带的 gh + GITHUB_TOKEN 发布，不引入第三方发布 action；
#   5) 发布这一步是**幂等**的：同一个 tag 重跑不会因为「Release 已存在」失败，
#      而是覆盖资产 + 更新说明（失败重跑、补说明都不用先手删 Release）；
#   6) 也支持 workflow_dispatch，但**必须跑在 tag 上**（第一步就挡掉分支）：
#      跑在分支上会把分支产物挂到某个 tag 的 Release 下，是事故；
#   7) 拿到产物后要做**签名回验**（scripts/verify_signature.ps1）：签名没开就明确打印
#      「本次产物未签名」，开了就必须逐个 Valid，否则整步红。绝不假装签过。
#      回验放在「生成发布说明」之前：说明里的 SHA-256 必须是最终（已签名）字节的哈希。
#
# 注意：2026-10-14 已在 v0.1.0 上真跑并全绿（12 步，含体积闸门与发布）。
#       本次真跑暴露了下面 env 里少的那两条，见 docs/p2-verification.md §15。
name: Release

on:
  push:
    tags: ["v*"]
  # 手动触发：不推新 tag 也能重验「生成发布说明 → 发布」这段。
  # 只能跑在 tag 上 —— 第一步会挡掉分支。
  workflow_dispatch:

permissions:
  contents: write

env:
  # 与 ci.yml 同一套设置。2026-10-14 release.yml 首次真跑时少了后两条，当场红在
  # 「PyInstaller 打包」：
  # 缺 MAX_ONEFOLDER_MB 就没有体积闸门（与文件头写的设计不符）；
  # 缺 PYTHONIOENCODING 则 PyInstaller 执行 spec 时那行中文 print 直接抛
  # UnicodeEncodeError（runner 是 en-US，stdout=cp1252、errors=strict）。
  # 补上后已重跑全绿，portable 93.22 MB / setup 64.36 MB，两条都在约束内。
  MDD_TRIM: safe
  MAX_ONEFOLDER_MB: "213"
  PYTHONIOENCODING: utf-8

jobs:
  release:
    name: 构建并发布
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      # 放最前面：跑在分支上就直接红在第一步，不浪费十分钟构建。
      - name: 校验触发方式（必须在 tag 上）
        shell: pwsh
        run: |
          # workflow_dispatch 在 UI/API 上可以选分支：跑在分支上会把分支产物挂到
          # 某个 tag 的 Release 下。这里直接挡掉。
          if ($env:GITHUB_REF_TYPE -ne 'tag') {
            throw "release.yml 必须跑在 tag 上（当前 ref_type=$env:GITHUB_REF_TYPE，ref=$env:GITHUB_REF）"
          }
          Write-Host "tag = $env:GITHUB_REF_NAME"

      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: 建虚拟环境并安装依赖
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --upgrade pip
          .\.venv\Scripts\python.exe -m pip install -e ".[dev]"

      - name: 校验 tag 与 pyproject 版本一致
        shell: pwsh
        run: |
          $tagVersion = $env:GITHUB_REF_NAME -replace '^v', ''
          $pyproject = Get-Content pyproject.toml -Raw
          if ($pyproject -notmatch '(?m)^version\s*=\s*"([^"]+)"') { throw "pyproject.toml 里读不到 version" }
          $projectVersion = $Matches[1]
          Write-Host "tag = $env:GITHUB_REF_NAME，pyproject = $projectVersion"
          if ($projectVersion -ne $tagVersion) { throw "版本不一致：tag $tagVersion vs pyproject $projectVersion" }

      - name: PyInstaller 打包
        shell: pwsh
        run: |
          # 用 Start-Process 把 stdout/stderr 落到文件：
          #   1) 避免 PowerShell 在 $ErrorActionPreference='stop' 下把原生命令的 stderr
          #      变成终止错误（本仓已有前例：GUI 子系统的 exe 也走 Start-Process）；
          #   2) 日志留给最后一步在失败时打成注解（Actions 日志 zip 的域名国内拉不到）。
          $proc = Start-Process -FilePath ".\.venv\Scripts\python.exe" `
            -ArgumentList "-m","PyInstaller","--noconfirm","--clean","packaging\markitdown-desktop.spec" `
            -RedirectStandardOutput pyinstaller-build.log `
            -RedirectStandardError pyinstaller-build.err.log `
            -Wait -PassThru -NoNewWindow
          Get-Content pyinstaller-build.log -Tail 15 -ErrorAction SilentlyContinue
          if ($proc.ExitCode -ne 0) { throw "PyInstaller 失败（退出码 $($proc.ExitCode)）" }

      - name: 体积闸门
        shell: pwsh
        run: |
          $bytes = (Get-ChildItem dist\markitdown-desktop -Recurse -File | Measure-Object Length -Sum).Sum
          $mb = [math]::Round($bytes / 1MB, 2)
          "one-folder = $mb MB（上限 $env:MAX_ONEFOLDER_MB MB）" | Tee-Object -FilePath size-report.txt
          if ($mb -gt [double]$env:MAX_ONEFOLDER_MB) { throw "体积回退：$mb MB 超过 $env:MAX_ONEFOLDER_MB MB" }

      - name: 冻结包自测（用现场生成的夹具）
        shell: pwsh
        run: |
          .\.venv\Scripts\python.exe scripts\ci_fixtures.py generate --out .ci-fixtures
          $exe = "dist\markitdown-desktop\markitdown-desktop.exe"
          # GUI 子系统（console=False）：`& $exe` 不会被等待、也不设 $LASTEXITCODE，
          # 必须用 Start-Process -Wait -PassThru（与 ci.yml 同一处理，见 p2-verification §14.7）
          $cliArgs = @("--selftest") + (Get-ChildItem .ci-fixtures -File).FullName +
                     @("--offscreen", "--json", "ci-selftest.json")
          $quoted = ($cliArgs | ForEach-Object { '"' + $_ + '"' }) -join " "
          $proc = Start-Process -FilePath $exe -ArgumentList $quoted -Wait -PassThru -NoNewWindow
          if ($proc.ExitCode -ne 0) { throw "冻结包自测失败，退出码 $($proc.ExitCode)" }
          .\.venv\Scripts\python.exe scripts\ci_fixtures.py check ci-selftest.json --dir .ci-fixtures

      - name: 安装 Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: 构建安装包与免安装 zip
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File scripts\build_installer.ps1 -SkipPyInstaller
          powershell -ExecutionPolicy Bypass -File scripts\build_portable.ps1 -SkipPyInstaller

      # 签名回验。签名本身（SignPath 路线）暂时没接：接它要先满足「仓库公开 +
      # SignPath 账号审核通过 + 拿到 organization/project/policy/artifact-configuration
      # 四个 slug」，见 docs/code-signing.md。所以这一步现在只做一件事：**不假装签过**。
      # 放在「生成发布说明」之前：说明里的 SHA-256 必须是最终（已签名）字节的哈希。
      - name: 验证签名
        shell: pwsh
        env:
          MDD_VERIFY_SIGNATURE: ${{ vars.MDD_VERIFY_SIGNATURE }}
        run: |
          if ($env:MDD_VERIFY_SIGNATURE -ne 'true') {
            Write-Host "::notice::签名未开启（仓库变量 MDD_VERIFY_SIGNATURE 不是 true）：本次产物**未签名**，跳过回验。开启步骤见 docs/code-signing.md。"
            exit 0
          }
          $targets = @(
            (Get-ChildItem dist\markitdown-desktop\markitdown-desktop.exe -ErrorAction SilentlyContinue),
            (Get-ChildItem dist\portable\MarkItDownDesktop-*\markitdown-desktop.exe -ErrorAction SilentlyContinue),
            (Get-ChildItem dist\installer\*-setup.exe -ErrorAction SilentlyContinue)
          ) | Where-Object { $_ } | ForEach-Object { $_.FullName }
          if ($targets.Count -lt 3) { throw "待验签的产物不全，实际只找到 $($targets.Count) 个" }
          # 传数组必须用 -Command + @(...)：实测 `-File ... -Path $数组` 会被展开成空格
          # 分隔的多个 argv，脚本那边直接报「找不到接受实际参数的位置形式参数」。
          $pathArgs = ($targets | ForEach-Object { "'$_'" }) -join ', '
          # 调原生 powershell：pwsh 默认 $ErrorActionPreference='stop'，放宽一下，
          # 免得 ps1 的 stderr 被当成终止性错误（本仓在「发布到 Release」踩过一次）。
          $ErrorActionPreference = 'Continue'
          powershell -ExecutionPolicy Bypass -Command "& 'scripts\verify_signature.ps1' -Path @($pathArgs) -JsonReport 'dist\signature-report.json'"
          if ($LASTEXITCODE -ne 0) { throw "签名校验未通过（退出码 $LASTEXITCODE）" }

      - name: 生成发布说明
        shell: pwsh
        run: |
          # 把 packaging\release-notes.md 这份模板里的 {{...}} 占位符，用真实产物的
          # 体积与 SHA-256 填掉，再交给 `gh release create --notes-file`。
          # 模板里打错一个占位符，下面的「还有没被替换的占位符」会当场 throw。
          # 体积与校验值都从**真实产物**算，不手写：说明里的数字不可能与实际不一致。
          $setup = Get-ChildItem dist\installer\*.exe | Select-Object -First 1
          $zip = Get-ChildItem dist\portable\*.zip | Select-Object -First 1
          if (-not $setup) { throw "没找到安装包" }
          if (-not $zip) { throw "没找到免安装 zip" }
          $notes = Get-Content packaging\release-notes.md -Raw -Encoding UTF8
          $map = [ordered]@{
            "{{TAG}}"             = $env:GITHUB_REF_NAME
            "{{SETUP_NAME}}"      = $setup.Name
            "{{SETUP_MB}}"        = [math]::Round($setup.Length / 1MB, 2)
            "{{SETUP_SHA256}}"    = (Get-FileHash $setup.FullName -Algorithm SHA256).Hash.ToLower()
            "{{PORTABLE_NAME}}"   = $zip.Name
            "{{PORTABLE_MB}}"     = [math]::Round($zip.Length / 1MB, 2)
            "{{PORTABLE_SHA256}}" = (Get-FileHash $zip.FullName -Algorithm SHA256).Hash.ToLower()
          }
          foreach ($key in $map.Keys) { $notes = $notes.Replace($key, [string]$map[$key]) }
          if ($notes -match '\{\{[A-Z0-9_]+\}\}') { throw "发布说明里还有没被替换的占位符" }
          # 显式写成**不带 BOM** 的 UTF-8：`Set-Content -Encoding utf8` 在 Windows
          # PowerShell 5.1 上会带 BOM（发布说明开头多个乱码字符）、在 pwsh 7 上不带。
          # 写死成与 PowerShell 版本无关的写法。
          $notesPath = Join-Path $PWD "release-notes.md"
          [System.IO.File]::WriteAllText($notesPath, $notes, (New-Object System.Text.UTF8Encoding $false))
          Get-Content release-notes.md -TotalCount 10

      - name: 发布到 Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 这一整步都在调原生 gh：它的「Release 不存在」与进度输出都写在 stderr。
          # Windows PowerShell 5.1 在 $ErrorActionPreference='stop' 下会把原生命令的
          # stderr 变成**终止错误**（2026-10-14 本机实测：`2>&1` 合并也拦不住，直接
          # threw），所以这里显式放宽，改由每次调用的 $LASTEXITCODE 判成败。
          $ErrorActionPreference = 'Continue'
          $tag = $env:GITHUB_REF_NAME
          $installer = (Get-ChildItem dist\installer\*.exe | Select-Object -First 1).FullName
          $zip = (Get-ChildItem dist\portable\*.zip | Select-Object -First 1).FullName
          if (-not $installer) { throw "没找到安装包" }
          if (-not $zip) { throw "没找到免安装 zip" }
          $null = gh release view $tag 2>&1
          if ($LASTEXITCODE -eq 0) {
            # 同一个 tag 重跑（或事后补说明）：覆盖资产 + 改说明，不新建 Release。
            # 先传资产再改说明，这样说明不会先于资产出现。
            Write-Host "Release $tag 已存在：覆盖资产并更新说明"
            gh release upload $tag $installer $zip THIRD-PARTY-NOTICES.md --clobber 2>&1 | Out-Host
            if ($LASTEXITCODE -ne 0) { throw "覆盖 Release 资产失败" }
            gh release edit $tag --title "MarkItDown Desktop $tag" `
              --notes-file release-notes.md 2>&1 | Out-Host
            if ($LASTEXITCODE -ne 0) { throw "更新 Release 说明失败" }
          } else {
            # 用模板生成的说明（含未签名提醒与真实 SHA-256），不用 --generate-notes：
            # 自动生成的 changelog 没有这些，用户拿到未签名的 exe 会一脸问号。
            gh release create $tag --title "MarkItDown Desktop $tag" `
              --notes-file release-notes.md $installer $zip THIRD-PARTY-NOTICES.md 2>&1 | Out-Host
            if ($LASTEXITCODE -ne 0) { throw "创建 Release 失败" }
          }

      - name: 上传构建报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-reports
          path: |
            ci-selftest.json
            size-report.txt
            release-notes.md
            pyinstaller-build.log
            pyinstaller-build.err.log
            dist\installer\build-report.json
            dist\portable\build-report.json
          if-no-files-found: warn

      # 必须放在最后：放中间会在前面的步骤失败时被跳过（ci.yml 实测踩过这个坑）。
      # Actions 日志 zip 存在 pipelines.actions.githubusercontent.com（国内连不通），
      # 但注解 API 是通的：把失败原因打成 ::error:: 注解，远端就能读到，不必人工贴日志。
      - name: 汇总失败原因（打成注解）
        if: failure()
        shell: pwsh
        run: |
          $py = ".\.venv\Scripts\python.exe"
          if (-not (Test-Path $py)) { Write-Host "::notice::虚拟环境不存在，跳过失败汇总"; exit 0 }
          foreach ($log in @("pyinstaller-build.err.log", "pyinstaller-build.log")) {
            if (-not (Test-Path $log)) { continue }
            $tail = Get-Content $log -Tail 8 | Where-Object { $_ -match '\S' }
            if (-not $tail) { continue }
            Write-Host "::group::$log 尾部"
            Get-Content $log -Tail 25
            Write-Host "::endgroup::"
            foreach ($line in $tail) { Write-Host "::error::$log | $($line.Trim())" }
          }
          & $py scripts\ci_failures.py --selftest ci-selftest.json
