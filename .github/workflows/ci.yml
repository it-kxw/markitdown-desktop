# MarkItDown Desktop —— CI：Windows 打包 + 冻结包自测 + 体积闸门
#
# 设计要点
#   1) 只跑 windows-latest：这是 Windows 桌面应用，别的平台打包没有意义；
#   2) 单元测试「有则跑、无则跳过」：发布分支只带运行所需文件，不含 tests/；
#   3) 夹具现场生成：CI 不依赖仓库里的二进制夹具（见 scripts/ci_fixtures.py）；
#   4) 体积是硬约束：one-folder 超阈值直接红灯（实测 211.5 MB，阈值 213 MB）；
#   5) 安装包与免安装 zip 只在手动触发并勾选 full 时构建（要装 Inno Setup，慢）。
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
    inputs:
      full:
        description: "同时构建安装包与免安装 zip（更慢）"
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # 与本地一致的裁剪档：只减冗余，不减功能
  MDD_TRIM: safe
  # one-folder 体积上限（MB）
  MAX_ONEFOLDER_MB: "213"
  # runner 是 en-US，stdout 默认 cp1252：不钉住 UTF-8，脚本印中文会 UnicodeEncodeError 崩掉
  PYTHONIOENCODING: utf-8

jobs:
  build:
    name: 打包与冻结包自测
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: 建虚拟环境并安装依赖（与 README 的本地流程一致）
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --upgrade pip
          .\.venv\Scripts\python.exe -m pip install -e ".[dev]"

      - name: 单元测试（仓库含 tests/ 时才跑）
        shell: pwsh
        run: |
          if (Test-Path tests) {
            .\.venv\Scripts\python.exe -m pytest --junitxml=pytest-report.xml
          } else {
            Write-Host "::notice::当前分支不含 tests/（发布分支只带运行所需文件），跳过单元测试"
          }

      - name: 生成 CI 夹具
        run: .\.venv\Scripts\python.exe scripts\ci_fixtures.py generate --out .ci-fixtures

      - name: PyInstaller 打包
        run: |
          .\.venv\Scripts\python.exe -m PyInstaller --noconfirm --clean packaging\markitdown-desktop.spec

      - name: 冻结包自测（含「成功但 0 字符」路径）
        shell: pwsh
        run: |
          $exe = "dist\markitdown-desktop\markitdown-desktop.exe"
          if (-not (Test-Path $exe)) { throw "冻结包不存在：$exe" }
          # 冻结包是 GUI 子系统（spec 里 console=False、PE Subsystem=2）：PowerShell 的
          # `& $exe` **不会等它**，也不会设 $LASTEXITCODE（实测为 $null，而
          # `$null -ne 0` 为真 -> 无条件 throw）。必须用 Start-Process -Wait -PassThru
          # 才拿得到真退出码；本地走 subprocess.run（Python 一律等待）所以没踩到。
          # 实测踩坑记录见 docs/p2-verification.md §14.7。
          $cliArgs = @("--selftest") + (Get-ChildItem .ci-fixtures -File).FullName +
                     @("--offscreen", "--json", "ci-selftest.json")
          $quoted = ($cliArgs | ForEach-Object { '"' + $_ + '"' }) -join " "
          $proc = Start-Process -FilePath $exe -ArgumentList $quoted -Wait -PassThru -NoNewWindow
          if ($proc.ExitCode -ne 0) { throw "冻结包自测失败，退出码 $($proc.ExitCode)" }
          .\.venv\Scripts\python.exe scripts\ci_fixtures.py check ci-selftest.json --dir .ci-fixtures

      - name: 体积闸门
        shell: pwsh
        run: |
          $bytes = (Get-ChildItem dist\markitdown-desktop -Recurse -File | Measure-Object Length -Sum).Sum
          $mb = [math]::Round($bytes / 1MB, 2)
          "one-folder = $mb MB（上限 $env:MAX_ONEFOLDER_MB MB）" | Tee-Object -FilePath size-report.txt
          if ($mb -gt [double]$env:MAX_ONEFOLDER_MB) { throw "体积回退：$mb MB 超过 $env:MAX_ONEFOLDER_MB MB" }

      - name: 安装包与免安装 zip（仅手动触发且勾选 full）
        if: github.event_name == 'workflow_dispatch' && inputs.full
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          powershell -ExecutionPolicy Bypass -File scripts\build_installer.ps1 -SkipPyInstaller
          powershell -ExecutionPolicy Bypass -File scripts\build_portable.ps1 -SkipPyInstaller

      - name: 上传报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-reports
          path: |
            ci-selftest.json
            size-report.txt
            pytest-report.xml
          if-no-files-found: warn

      # 必须放在最后：放中间会在前面的步骤失败时被跳过（T22 实测踩过这个坑）。
      # 日志 zip 存在 pipelines.actions.githubusercontent.com（国内连不通），
      # 但注解 API 是通的：把失败原因打成 ::error:: 注解，远端就能读到，不必人工贴日志
      - name: 汇总失败原因（打成注解）
        if: failure()
        shell: pwsh
        run: |
          $py = ".\.venv\Scripts\python.exe"
          if (-not (Test-Path $py)) { Write-Host "::notice::虚拟环境不存在，跳过失败汇总"; exit 0 }
          & $py scripts\ci_failures.py pytest-report.xml
          & $py scripts\ci_failures.py --selftest ci-selftest.json
